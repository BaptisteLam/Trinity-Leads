name = "trinity-leads"
type = "javascript"
compatibility_date = "2024-01-01"

# Pour Cloudflare Pages - ajouter ces variables
[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }

# KV Namespace pour stocker les leads
[[kv_namespaces]]
binding = "LEADS_KV"
id = "trinity-leads-kv"
preview_id = "trinity-leads-preview"

